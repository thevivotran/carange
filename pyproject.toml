[project]
name = "carange"
version = "0.8.0"
description = "Self-hosted family finance tracker — FastAPI + SQLite/PostgreSQL with OCR and email transaction ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "alembic==1.20.1",
    "beautifulsoup4==4.15.0",
    "fastapi==0.162.0",
    "imapclient==4.1.0",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dateutil==4.0.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.33",
    "requests==2.34.2",
    "sqlalchemy==2.1.8",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "idna>=3.15",
    "mako>=1.3.12",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]
