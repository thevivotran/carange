{% set data = summary %}
<div class="grid grid-cols-2 gap-x-4 gap-y-1 sm:flex sm:flex-wrap sm:gap-x-5 sm:gap-y-1 w-full">
  <span class="text-gray-500 flex flex-col sm:flex-row sm:gap-1">Income <span class="amount tabular-nums whitespace-nowrap font-semibold text-income">{{ data.income | currency }}</span></span>
  <span class="text-gray-500 flex flex-col sm:flex-row sm:gap-1">Expense <span class="amount tabular-nums whitespace-nowrap font-semibold text-expense">{{ data.expense | currency }}</span></span>
  <span class="text-gray-500 flex flex-col sm:flex-row sm:gap-1">Savings <span class="amount tabular-nums whitespace-nowrap font-semibold text-indigo-600">{{ data.savings | currency }}</span></span>
  <span class="text-gray-500 flex flex-col sm:flex-row sm:gap-1" title="Period net flow = income − expense − savings within the current fiscal period (or your active filters).">Net Flow <span class="amount tabular-nums whitespace-nowrap font-semibold text-blue-600">{{ data.net | currency }}</span></span>
</div>
