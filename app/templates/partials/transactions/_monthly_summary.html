{% set data = summary %}
{# One row that scrolls sideways on phones instead of a 2×2 block above the list. #}
<div class="flex gap-x-5 overflow-x-auto whitespace-nowrap w-full -mx-1 px-1">
  <span class="text-gray-500 flex-shrink-0">Income <span class="amount tabular-nums font-semibold text-income">{{ data.income | currency }}</span></span>
  <span class="text-gray-500 flex-shrink-0">Expense <span class="amount tabular-nums font-semibold text-expense">{{ data.expense | currency }}</span></span>
  <span class="text-gray-500 flex-shrink-0">Savings <span class="amount tabular-nums font-semibold text-gray-800">{{ data.savings | currency }}</span></span>
  <span class="text-gray-500 flex-shrink-0" title="Period net flow = income − expense − savings within the current fiscal period (or your active filters).">Net flow <span class="amount tabular-nums font-semibold {{ 'text-success' if data.net > 0 else ('text-danger' if data.net < 0 else 'text-gray-800') }}">{{ data.net | currency(signed=true) }}</span></span>
</div>
